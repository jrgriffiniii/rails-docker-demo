apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: web
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: web
    spec:
      containers:
        - image: rails-docker-demo-web:latest
          imagePullPolicy: Never
          name: web
          env:
            - name: DATABASE_HOST
              value: db
            - name: DATABASE_USER
              value: postgres
            - name: DATABASE_PASSWORD
              value: password
            - name: DATABASE_NAME
              value: hello_world_development
            - name: RAILS_ENV
              value: development
          ports:
            - containerPort: 3000
          command:
            ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
          resources: {}
status: {}
